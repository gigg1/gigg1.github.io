body-class: page-404

<style>
  /* ============================================================
     404 page — full-page starfield background, all-white text.
     Everything is scoped to body.page-404 so no other page is
     affected. The sky is pure CSS (tiled radial-gradients), so
     there is no image request and no JavaScript.
     ============================================================ */

  /* --- night sky: dark base + star layers --- */
  body.page-404 {
    background-color: #0a0910;
    background-image: none;
  }

  /* Three tiled star layers at different tile sizes give depth:
     small tile = dense faint dust, larger tile = sparse bright stars. */
  body.page-404::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-color: #0a0910;
    background-image:
      /* bright foreground stars (largest tile, sparse) */
      radial-gradient(1.5px 1.5px at 24px 36px, #ffffff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 152px 104px, #ffffff 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 88px 182px, #ffffff 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 216px 58px, #ffffff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 118px 14px, #ffffff 50%, transparent 51%),
      /* mid layer */
      radial-gradient(1.1px 1.1px at 52px 92px, rgba(255, 255, 255, 0.82) 50%, transparent 51%),
      radial-gradient(1.1px 1.1px at 186px 156px, rgba(255, 255, 255, 0.78) 50%, transparent 51%),
      radial-gradient(1.1px 1.1px at 8px 128px, rgba(255, 255, 255, 0.72) 50%, transparent 51%),
      radial-gradient(1.1px 1.1px at 244px 96px, rgba(255, 255, 255, 0.7) 50%, transparent 51%),
      /* rare blue accents, echoing the navbar sky */
      radial-gradient(1.5px 1.5px at 164px 62px, rgba(111, 192, 255, 0.95) 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 38px 148px, rgba(111, 192, 255, 0.8) 50%, transparent 51%),
      /* dense faint dust (smallest tile) */
      radial-gradient(0.9px 0.9px at 18px 22px, rgba(255, 255, 255, 0.4) 50%, transparent 51%),
      radial-gradient(0.9px 0.9px at 62px 54px, rgba(255, 255, 255, 0.36) 50%, transparent 51%),
      radial-gradient(0.9px 0.9px at 94px 78px, rgba(255, 255, 255, 0.33) 50%, transparent 51%),
      radial-gradient(0.9px 0.9px at 34px 86px, rgba(255, 255, 255, 0.3) 50%, transparent 51%),
      radial-gradient(0.9px 0.9px at 76px 118px, rgba(255, 255, 255, 0.32) 50%, transparent 51%),
      radial-gradient(0.9px 0.9px at 106px 40px, rgba(255, 255, 255, 0.28) 50%, transparent 51%);
    background-size:
      280px 240px, 280px 240px, 280px 240px, 280px 240px, 280px 240px,
      190px 170px, 190px 170px, 190px 170px, 190px 170px,
      400px 360px, 400px 360px,
      110px 100px, 110px 100px, 110px 100px, 110px 100px, 110px 100px, 110px 100px;
    background-repeat: repeat;
  }

  /* very slow, subtle breathing of the whole sky */
  @media (prefers-reduced-motion: no-preference) {
    body.page-404::before { animation: sky-breathe 9s ease-in-out infinite; }
  }
  @keyframes sky-breathe {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.9; }
  }

  /* --- keep content above the sky --- */
  body.page-404 .intro-header,
  body.page-404 [role="main"],
  body.page-404 footer {
    position: relative;
    z-index: 1;
  }
  /* the empty page header just adds dead space here */
  body.page-404 .intro-header {
    display: none;
  }

  body.page-404 [role="main"] {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: calc(100vh - 4rem);
    padding-top: 4rem;
    padding-bottom: 3rem;
  }

  /* --- text --- */
  body.page-404 .nf {
    max-width: 34rem;
    margin: 0 auto;
    text-align: center;
  }
  body.page-404 .nf__code {
    font-size: 4.6rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.1em;
    color: #f6d9e0;
    margin: 0 0 0.9rem;
    text-shadow: 0 0 20px rgba(246, 217, 224, 0.5), 0 0 56px rgba(246, 217, 224, 0.28);
  }
  body.page-404 .nf__title {
    font-size: 1.5rem;
    font-weight: 700;
    color: #f6d9e0;
    margin: 0 0 0.7rem;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5), 0 0 22px rgba(246, 217, 224, 0.26);
  }
  body.page-404 .nf__text {
    font-size: 0.98rem;
    line-height: 1.7;
    color: rgba(246, 217, 224, 0.85);
    margin: 0 0 2rem;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
  }

  /* --- pill links --- */
  body.page-404 .nf__links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    justify-content: center;
  }
  body.page-404 .nf__link {
    display: inline-flex;
    align-items: center;
    padding: 0.5rem 1.15rem;
    border: 1px solid rgba(246, 217, 224, 0.42);
    border-radius: 999px;
    background: rgba(246, 217, 224, 0.1);
    color: #f6d9e0;
    font-size: 0.92rem;
    font-weight: 700;
    text-decoration: none;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
  }
  body.page-404 .nf__link:hover,
  body.page-404 .nf__link:focus {
    background: rgba(246, 217, 224, 0.24);
    border-color: rgba(246, 217, 224, 0.75);
    color: #ffffff;
    text-decoration: none;
    transform: translateY(-2px);
  }

  /* --- footer blends into the night sky --- */
  body.page-404 footer {
    margin-top: 0;
    background-color: transparent;
    background-image: none;
  }
  body.page-404 footer a,
  body.page-404 footer p.text-muted {
    color: rgba(246, 217, 224, 0.78) !important;
  }
  body.page-404 footer a:hover,
  body.page-404 footer a:focus {
    color: #f6d9e0 !important;
  }
</style>

  </p>
